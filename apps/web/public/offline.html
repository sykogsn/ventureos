<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d5248" />
    <title>Frigora is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f6f3;
        color: #1a1916;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
      }
      p.kicker {
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: #6f6b64;
        margin: 0 0 0.75rem;
      }
      h1 {
        font-size: 1.625rem;
        font-weight: 650;
        margin: 0 0 0.75rem;
      }
      p.body {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        color: #4e4b46;
      }
      button {
        font: inherit;
        border: 0;
        border-radius: 0.375rem;
        background: #3d5248;
        color: #f8f6f1;
        padding: 0.65rem 1rem;
        min-height: 2.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Frigora</p>
      <h1>Frigora is offline</h1>
      <p class="body">
        This install cannot complete field work without a connection. Nothing is queued
        on this device for later sync. Reconnect, then continue the live job.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
